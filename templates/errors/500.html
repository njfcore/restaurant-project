{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Something Went Wrong | {{ restaurant.name }}</title>

    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/pages/error.css' %}"
    >

</head>

<body>

    <main class="error-page">

        <div class="container">

            <section class="error-page__content">

                <span class="error-page__code">
                    500
                </span>

                <span class="error-page__subtitle">
                    SERVER ERROR
                </span>

                <h1 class="error-page__title">
                    Something Went Wrong in Our Kitchen.
                </h1>

                <p class="error-page__description">
                    Something unexpected happened on our side.
                    Please try again in a moment or return to the homepage.
                </p>

                <div class="error-page__actions">

                    <a
                        href="{% url 'home' %}"
                        class="error-page__button error-page__button--primary"
                    >
                        Back to Home
                    </a>

                    <a
                        href="javascript:location.reload();"
                        class="error-page__button error-page__button--secondary"
                    >
                        Try Again
                    </a>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
