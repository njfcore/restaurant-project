{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Access Denied | {{ restaurant.name }}</title>

    <link
        rel="stylesheet"
        href="{% static 'css/base.css' %}"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/pages/error.css' %}"
    >

</head>

<body>

    <main class="error-page">

        <div class="container">

            <section class="error-page__content">

                <span class="error-page__code">
                    403
                </span>

                <span class="error-page__subtitle">
                    ACCESS DENIED
                </span>

                <h1 class="error-page__title">
                    Sorry, You Can't Enter This Kitchen.
                </h1>

                <p class="error-page__description">
                    You don't have permission to access this page.
                    Please make sure you're logged in with the appropriate account.
                </p>

                <div class="error-page__actions">

                    <a
                        href="{% url 'home' %}"
                        class="error-page__button error-page__button--primary"
                    >
                        Back to Home
                    </a>

                    <a
                        href="{% url 'account:login' %}"
                        class="error-page__button error-page__button--secondary"
                    >
                        Login
                    </a>

                </div>

            </section>

        </div>

    </main>

</body>

</html>
