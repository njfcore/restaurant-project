<section class="hero">

    <div class="hero__overlay"></div>

    <div class="container">

        <div class="hero__content">

            <span class="hero__subtitle">
                Authentic Italian Cuisine
            </span>

            <h1 class="hero__title">
                Experience the True Taste of Italy
            </h1>

            <p class="hero__description">
                Discover handcrafted pizzas, fresh pasta, premium ingredients,
                and an unforgettable dining experience inspired by traditional
                Italian recipes.
            </p>

            <div class="hero__actions">

                <a href="{% url 'menu' %}" class="hero__button hero__button--primary">
                    Explore Menu
                </a>

                <a href="{% url 'reservation' %}" class="hero__button hero__button--secondary">
                    Reserve a Table
                </a>

            </div>

        </div>

    </div>

    <a href="#categories" class="hero__scroll" aria-label="Scroll to next section">

        <span class="hero__scroll-text">
            Scroll
        </span>

        <span class="hero__scroll-icon">
            <i class="bi bi-chevron-double-down"></i>
        </span>

    </a>
</section>
