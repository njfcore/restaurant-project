{% load static %}

<article class="food-card">

    <div class="food-card__image-wrapper">

        {% if food.image %}

            <img
                src="{{ food.image.url }}"
                alt="{{ food.name }}"
                class="food-card__image">

        {% else %}

            <img
                src="{% static 'images/foods/default.jpg' %}"
                alt="{{ food.name }}"
                class="food-card__image">

        {% endif %}

        {% if food.is_featured %}

            <span class="food-card__badge">

                Chef's Choice

            </span>

        {% endif %}

        <span class="food-card__price">

            ${{ food.price }}

        </span>

    </div>

    <div class="food-card__content">

        <span class="food-card__category">

            {{ food.category.name }}

        </span>

        <h3 class="food-card__title">

            {{ food.name }}

        </h3>

        <p class="food-card__description">

            {{ food.short_description }}

        </p>

        <div class="food-card__meta">

            <span class="food-card__meta-item">

                <i class="bi bi-clock"></i>

                {{ food.preparation_time }} min

            </span>

            <span class="food-card__meta-item">

                <i class="bi bi-fire"></i>

                {{ food.calories }} kcal

            </span>

        </div>

        <div class="food-card__footer">

            <a href="{% url 'food_detail' food.slug %}" class="food-card__button"
               class="food-card__button">

                View Details

                <i class="bi bi-arrow-right"></i>

            </a>

        </div>

    </div>

</article>
